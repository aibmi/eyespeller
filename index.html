<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>100% Persistent Local Voice Speller</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body { font-family: -apple-system, sans-serif; background: #000000; color: #ffffff; margin: 0; padding: 15px; display: flex; flex-direction: column; height: 100vh; box-sizing: border-box; overflow: hidden; }
        #preview-box { width: 100%; padding: 20px; font-size: 36px; font-weight: bold; background: #1c1c1e; color: #ffffff; text-align: left; border-radius: 12px; min-height: 80px; box-sizing: border-box; border: 2px solid #2c2c2e; margin-bottom: 15px; word-wrap: break-word; }
        .space-gap { display: inline-block; width: 32px; }
        #matrix { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; flex-grow: 1; }
        .grid-button { background: #1c1c1e; color: #ffffff; border: 3px solid #2c2c2e; border-radius: 16px; display: flex; justify-content: center; align-items: center; font-size: 26px; font-weight: bold; transition: all 0.05s; }
        .active-focus { border-color: #30d158 !important; background: #1c3d22 !important; box-shadow: 0 0 15px #30d158; }
        .trigger-flash { background: #30d158 !important; color: #000000 !important; }
        #video-container { position: absolute; bottom: 10px; right: 10px; width: 100px; height: 75px; border-radius: 8px; overflow: hidden; border: 3px solid #ff3b30; opacity: 0.8; z-index: 9999; background: #222; }
        video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        /* CHANGED: visual box showing which face region is being watched, for the eyebrow/mouth modes */
        #region-box { position: absolute; border: 2px dashed #ffd60a; pointer-events: none; display: none;}
        .region-box-extra { position: absolute; border: 2px dashed #ffd60a; pointer-events: none; }

        #voice-gate-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.92); z-index: 100000; display: flex; flex-direction: column; justify-content: center; align-items: center; box-sizing: border-box; padding: 30px; }
        #voice-gate-btn { background: #30d158; color: #000000; font-size: 32px; font-weight: bold; padding: 25px 40px; border-radius: 20px; border: none; width: 100%; max-width: 600px; box-shadow: 0 0 25px #30d158; text-align: center; }
    </style>
</head>
<body>

    <div id="voice-gate-overlay">
        <button id="voice-gate-btn">音声許可のためにここをタッチしてください<br><span style="font-size:20px; font-weight:normal; display:block; margin-top:10px;">Touch here to allow voice</span></button>
    </div>

    <div id="preview-box">＿</div>
    <div id="debug-readout" style="font-size:14px; color:#ffd60a; padding:2px 4px;"></div>
    <div id="matrix"></div>
    
    <div id="video-container">
        <video id="webcam" autoplay playsinline muted crossorigin="anonymous"></video>
        <div id="region-box"></div>
    </div>
<script>
let trackingReady = false; 
let cameraUnlocked = false;
let cooldownActive = false; 
let globalAudioCtx = null; 

// --- UNFREEZABLE RENDER-LOOP REFRESH TIMERS ---
const FIVE_MINUTES = 5 * 60 * 1000;
const TWENTY_FOUR_HOURS = 24 * 60 * 60 * 1000;
let lastRefreshCheckTime = Date.now();

let startTime = localStorage.getItem('bluefy_refresh_start');
if (!startTime) {
    startTime = Date.now();
    localStorage.setItem('bluefy_refresh_start', startTime);
    setTimeout(() => { window.location.reload(); }, 2000);
}

function processActiveUnfreezableRefresh() {
    const NOW = Date.now();
    if (NOW - startTime >= TWENTY_FOUR_HOURS) {
        localStorage.removeItem('bluefy_refresh_start');
        localStorage.removeItem('ios_voice_authorized_token');
        return; 
    }
    if (NOW - lastRefreshCheckTime >= FIVE_MINUTES) {
        window.location.reload();
    }
}

document.getElementById('voice-gate-btn').addEventListener('click', () => {
    localStorage.setItem('ios_voice_authorized_token', 'true');
    document.getElementById('voice-gate-overlay').style.display = 'none';
    initializeHardwareAudio();
    let warmupSpeech = new SpeechSynthesisUtterance("");
    window.speechSynthesis.speak(warmupSpeech);
});

if (localStorage.getItem('ios_voice_authorized_token') === 'true') {
    document.getElementById('voice-gate-overlay').style.display = 'none';
}

const characterTree = [
    { name: "あ行", items: ["あ", "い", "う", "え", "お", "前"] },
    { name: "か行", items: ["か", "き", "く", "け", "こ", "が", "ぎ", "ぐ", "げ", "ご", "前"] },
    { name: "さ行", items: ["さ", "し", "す", "せ", "そ", "ざ", "じ", "ず", "ぜ", "ぞ", "前"] },
    { name: "た行", items: ["た", "ち", "つ", "て", "と", "だ", "ぢ", "づ", "で", "ど", "前"] },
    { name: "な行", items: ["な", "に", "ぬ", "ね", "の", "前"] },
    { name: "は行", items: ["は", "ひ", "ふ", "へ", "ほ", "ば", "び", "ぶ", "べ", "ぼ", "ぱ", "ぴ", "ぷ", "ぺ", "ぽ", "前"] },
    { name: "ま行", items: ["ま", "み", "む", "め", "も", "前"] },
    { name: "や行", items: ["や", "ゆ", "よ", "前"] },
    { name: "ら行", items: ["ら", "り", "る", "れ", "ろ", "前"] },
    { name: "わ行", items: ["わ", "を", "ん", "ゃ", "ゅ", "ょ", "っ", "前"] },
    { name: "メニュー", items: ["スペース", "読み上げ", "おねがい", "一文字消去", "全消去", "休止モード", "前"] }
];

let constructedString = "";
let currentTier = 1; 
let activeRowIndex = 0;
let activeColIndex = 0;
let loopInterval = null;
let isBroadcasting = false;
let isSleeping = false;
let video, canvas, ctx;
let prevFrameData = null;
let motionTriggered = false;

const SCAN_INTERVAL_MS = 2000;
const FIRST_CELL_EXTRA_PAUSE_MS = 3000;
let pendingExtraPause = false;
const WORD_PAUSE_MS = 400;

// ==========================================================================
// CHANGED: TRIGGER MODE SWITCH
// Change this one value to test a different detection signal.
// Options: "head"  -> whole-frame lateral motion (original, glasses-safe, works late-stage)
//          "eyebrow" -> narrow band above the eyes (works well early/mid-stage, can be
//                        affected by glasses glare/frame edges)
//          "mouth"   -> narrow band around the mouth (glasses-proof, tends to stay usable
//                        longest for limb-onset ALS, may fail sooner for bulbar-onset)
// ==========================================================================
const TRIGGER_MODE = "eyebrow";
const DETECTION_METHOD = { eyebrow: "color", mouth: "color" };
    
// CHANGED: region definitions as fractions of the canvas, used only by eyebrow/mouth modes.
// Assumes a roughly centered, front-facing camera view (matches this app's 160x120 webcam feed).
const REGION_DEFS = {
    eyebrow: [
        { xStart: 0.25, xEnd: 0.39, yStart: 0.22, yEnd: 0.32 },
        { xStart: 0.40, xEnd: 0.54, yStart: 0.22, yEnd: 0.32 }
    ],
    mouth:   { xStart: 0.30, xEnd: 0.45, yStart: 0.42, yEnd: 0.54 }
};
const TRIGGER_THRESHOLDS = {
    head:    { unlock: 0.1, trigger: 0.5, reset: 0.2 },
    eyebrow: { unlock: 0.1, trigger: 0.2, reset: 0.12 },
    mouth:   { unlock: 0.1, trigger: 1.3, reset: 0.5 }
};

const previewDOM = document.getElementById("preview-box");
const matrixDOM = document.getElementById("matrix");
const videoContainerDOM = document.getElementById("video-container");
const regionBoxDOM = document.getElementById("region-box"); // CHANGED

function initializeHardwareAudio() {
    if (!globalAudioCtx) {
        globalAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
}

function playBlinkConfirmationSound() {
    try {
        initializeHardwareAudio();
        if (globalAudioCtx.state === 'suspended') { globalAudioCtx.resume(); }
        const oscillator = globalAudioCtx.createOscillator();
        const gainNode = globalAudioCtx.createGain();
        oscillator.type = 'sine';
        oscillator.frequency.setValueAtTime(880, globalAudioCtx.currentTime); 
        gainNode.gain.setValueAtTime(0.15, globalAudioCtx.currentTime); 
        gainNode.gain.exponentialRampToValueAtTime(0.001, globalAudioCtx.currentTime + 0.12);
        oscillator.connect(gainNode);
        gainNode.connect(globalAudioCtx.destination);
        oscillator.start();
        oscillator.stop(globalAudioCtx.currentTime + 0.12);
    } catch (e) {}
}

function buildTier1UI() {
    matrixDOM.innerHTML = "";
    matrixDOM.style.gridTemplateColumns = "repeat(4, 1fr)";
    characterTree.forEach((row, index) => {
        let btn = document.createElement("div");
        btn.className = "grid-button";
        btn.id = `cell-${index}`;
        btn.innerText = row.name;
        matrixDOM.appendChild(btn);
    });
    updateFocusVisuals();
}
function buildTier2UI(rowIndex) {
    matrixDOM.innerHTML = "";
    const activeRowItems = characterTree[rowIndex].items;
    matrixDOM.style.gridTemplateColumns = activeRowItems.length > 6 ? "repeat(4, 1fr)" : "repeat(3, 1fr)";
    activeRowItems.forEach((item, index) => {
        let btn = document.createElement("div");
        btn.className = "grid-button";
        btn.id = `cell-${index}`;
        btn.innerText = item;
        matrixDOM.appendChild(btn);
    });
    updateFocusVisuals();
}

function updateFocusVisuals() {
    document.querySelectorAll(".grid-button").forEach(el => el.classList.remove("active-focus"));
    let activeId = currentTier === 1 ? `cell-${activeRowIndex}` : `cell-${activeColIndex}`;
    let targetElement = document.getElementById(activeId);
    if (targetElement) targetElement.classList.add("active-focus");
}

function renderPreview() {
    let display = constructedString === "" ? "＿" : constructedString + "＿";
    let html = display.split(" ").join('<span class="space-gap"></span>');
    previewDOM.innerHTML = html;
}

function scheduleNextScanTick() {
    let delay = SCAN_INTERVAL_MS;
    if (pendingExtraPause) {
        delay += FIRST_CELL_EXTRA_PAUSE_MS;
        pendingExtraPause = false;
    }
    loopInterval = setTimeout(() => {
        if (!(isBroadcasting || isSleeping || !trackingReady)) {
            if (currentTier === 1) {
                activeRowIndex = (activeRowIndex + 1) % characterTree.length;
            } else {
                const maxCols = characterTree[activeRowIndex].items.length;
                activeColIndex = (activeColIndex + 1) % maxCols;
            }
            updateFocusVisuals();
        }
        scheduleNextScanTick();
    }, delay);
}

function startMasterScanLoop() {
    if (loopInterval) clearTimeout(loopInterval);
    scheduleNextScanTick();
}

function executeSelectionAction() {
    if (isBroadcasting || !trackingReady || cooldownActive) return;
    
    cooldownActive = true; 
    videoContainerDOM.style.borderColor = "#ff3b30"; 
    
    let targetId = currentTier === 1 ? `cell-${activeRowIndex}` : `cell-${activeColIndex}`;
    let targetElement = document.getElementById(targetId);
    if (targetElement) targetElement.classList.add("trigger-flash");
    
    playBlinkConfirmationSound(); 

    setTimeout(() => {
        if (currentTier === 1) {
            currentTier = 2;
            activeColIndex = 0;
            buildTier2UI(activeRowIndex);
            pendingExtraPause = true;
            if (loopInterval) clearTimeout(loopInterval); // FIXED: cancel in-flight tick so the extra pause lands on the first character
            scheduleNextScanTick();
        } else {
            const selectedItem = characterTree[activeRowIndex].items[activeColIndex];
            processSelection(selectedItem);
        }
    }, 150);

    setTimeout(() => {
        cooldownActive = false;
        if (cameraUnlocked) videoContainerDOM.style.borderColor = "#007aff";
    }, 2500);
}

function processSelection(value) {
    if (value === "前") { returnToTier1(); return; }
    if (activeRowIndex === 10) { 
        switch(value) {
            case "スペース": constructedString += " "; break;
            case "一文字消去": constructedString = constructedString.slice(0, -1); break;
            case "全消去": constructedString = ""; break;
            case "読み上げ": broadcastTrueIphoneSpeech(constructedString); break; 
            case "おねがい": 
                constructedString += "お願いします";
                renderPreview();
                broadcastTrueIphoneSpeech("お願いします"); 
                break;
            case "休止モード": enterSleepState(); return;
        }
    } else { constructedString += value; }
    renderPreview();
    returnToTier1();
}

function returnToTier1() { currentTier = 1; buildTier1UI(); }

function broadcastTrueIphoneSpeech(textToSpeak) {
    if (!textToSpeak || textToSpeak.trim() === "") return;
    isBroadcasting = true;
    initializeHardwareAudio();
    window.speechSynthesis.cancel();

    const words = textToSpeak.split(" ").filter(w => w.length > 0);
    let wordIndex = 0;

    function speakNextWord() {
        if (wordIndex >= words.length) { isBroadcasting = false; return; }
        let utterance = new SpeechSynthesisUtterance(words[wordIndex]);
        utterance.lang = 'ja-JP';
        utterance.rate = 0.85;
        let systemVoices = window.speechSynthesis.getVoices();
        let maleVoice = systemVoices.find(v => v.lang.includes('ja') && (v.name.includes('Otoya') || v.name.includes('Hattori') || v.name.includes('Male')));
        if (maleVoice) utterance.voice = maleVoice;
        utterance.onend = function() {
            wordIndex++;
            if (wordIndex < words.length) {
                setTimeout(speakNextWord, WORD_PAUSE_MS);
            } else {
                isBroadcasting = false;
            }
        };
        utterance.onerror = function() { isBroadcasting = false; };
        window.speechSynthesis.speak(utterance);
    }
    speakNextWord();
}

function enterSleepState() {
    isSleeping = true;
    matrixDOM.innerHTML = "<div class='grid-button active-focus' id='sleep-btn' style='grid-column: span 4; background: #000; border-color: #222; color: #555;'>💤 休止中 (首を振って再開)</div>";
}

function exitSleepState() { isSleeping = false; returnToTier1(); }

// CHANGED: draws the dashed yellow box over the watched region, so you can see exactly what
// eyebrow/mouth mode is looking at while you test and adjust REGION_DEFS.

function drawRegionOverlay() {
    if (TRIGGER_MODE === "head") { regionBoxDOM.style.display = "none"; return; }
    const regionData = REGION_DEFS[TRIGGER_MODE];
    const regions = Array.isArray(regionData) ? regionData : [regionData];
    document.querySelectorAll(".region-box-extra").forEach(el => el.remove());
    const containerW = videoContainerDOM.clientWidth;
    const containerH = videoContainerDOM.clientHeight;
    regions.forEach((region, i) => {
        let box = i === 0 ? regionBoxDOM : regionBoxDOM.cloneNode();
        if (i > 0) { box.className = "region-box-extra"; videoContainerDOM.appendChild(box); }
        box.style.display = "block";
        box.style.left = (region.xStart * containerW) + "px";
        box.style.top = (region.yStart * containerH) + "px";
        box.style.width = ((region.xEnd - region.xStart) * containerW) + "px";
        box.style.height = ((region.yEnd - region.yStart) * containerH) + "px";
    });
}
async function setupWebcam() {
    video = document.getElementById('webcam');
    canvas = document.createElement('canvas');
    ctx = canvas.getContext('2d');
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user", width: 160, height: 120 } });
        video.srcObject = stream;
        video.setAttribute('playsinline', 'true');
        video.setAttribute('webkit-playsinline', 'true');
        video.addEventListener('loadedmetadata', () => {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            video.muted = true;
            video.play().catch(() => { video.muted = false; video.play(); });
            setTimeout(() => { trackingReady = true; }, 6000);
            drawRegionOverlay(); // CHANGED
            requestAnimationFrame(analyzePixelsLoop);
        });
    } catch (err) {}
}

// CHANGED: whole-frame lateral-shift detection — this is the original "head" logic,
// pulled out into its own function so it can sit alongside the new region-based one.
function computeHeadMotionRatio(data, w, h) {
    let lateralShiftPixels = 0;
    let totalChecked = 0;
    for (let y = 4; y < h - 4; y += 4) {
        for (let x = 8; x < w - 8; x += 4) {
            let idx = (y * w + x) * 4;
            let currentCenter = (data[idx] + data[idx+1] + data[idx+2]) / 3;
            let prevLeftNeighbor = (prevFrameData[idx - 8] + prevFrameData[idx - 7] + prevFrameData[idx - 6]) / 3;
            let prevRightNeighbor = (prevFrameData[idx + 8] + prevFrameData[idx + 9] + prevFrameData[idx + 10]) / 3;
            if ((Math.abs(currentCenter - prevLeftNeighbor) < 6 || Math.abs(currentCenter - prevRightNeighbor) < 6) && Math.abs(data[idx] - prevFrameData[idx]) > 8) {
                lateralShiftPixels++;
            }
            totalChecked++;
        }
    }
    return totalChecked > 0 ? (lateralShiftPixels / totalChecked) * 100 : 0;
}

// CHANGED: region-based brightness-change detection — used for both eyebrow and mouth modes.
// Unlike head mode, this only looks inside a small rectangle (REGION_DEFS) and just checks
// for straightforward brightness change there, since an eyebrow/mouth movement causes a
// localized shadow/skin change rather than the lateral edge shift a turning head produces.
function computeRegionMotionRatio(data, w, h, region, method) {
    const xStart = Math.floor((1 - region.xEnd) * w);
    const xEnd = Math.floor((1 - region.xStart) * w);
    
    const yStart = Math.floor(region.yStart * h);
    const yEnd = Math.floor(region.yEnd * h);
    let changedPixels = 0;
    let totalChecked = 0;
    for (let y = yStart; y < yEnd; y += 2) {
        for (let x = xStart; x < xEnd; x += 2) {
            let idx = (y * w + x) * 4;
            let changed = false;
            if (method === "color") {
                let dr = data[idx] - prevFrameData[idx];
                let dg = data[idx+1] - prevFrameData[idx+1];
                let db = data[idx+2] - prevFrameData[idx+2];
                let colorDistance = Math.sqrt(dr*dr + dg*dg + db*db);
                if (colorDistance > 18) changed = true;
            } else {
                let currentBrightness = (data[idx] + data[idx+1] + data[idx+2]) / 3;
                let prevBrightness = (prevFrameData[idx] + prevFrameData[idx+1] + prevFrameData[idx+2]) / 3;
                if (Math.abs(currentBrightness - prevBrightness) > 10) changed = true;
            }
            if (changed) {
                changedPixels++;
            }
            totalChecked++;
        }
    }
    return totalChecked > 0 ? (changedPixels / totalChecked) * 100 : 0;
}
function analyzePixelsLoop() {
    if (!video || video.paused || video.ended) { requestAnimationFrame(analyzePixelsLoop); return; }
    
    processActiveUnfreezableRefresh();

    try {
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const data = imgData.data;
        if (prevFrameData === null) {
            prevFrameData = new Uint8ClampedArray(data);
            requestAnimationFrame(analyzePixelsLoop);
            return;
        }
        let w = canvas.width;
        let h = canvas.height;

        // CHANGED: pick which detector to run based on TRIGGER_MODE
        let motionRatio;
        if (TRIGGER_MODE === "head") {
            motionRatio = computeHeadMotionRatio(data, w, h);
        } else {
            const regionData = REGION_DEFS[TRIGGER_MODE];
            const regionsToCheck = Array.isArray(regionData) ? regionData : [regionData];
            motionRatio = Math.max(...regionsToCheck.map(r => computeRegionMotionRatio(data, w, h, r, DETECTION_METHOD[TRIGGER_MODE])));
        }
        document.getElementById('debug-readout').innerText = 'ratio: ' + motionRatio.toFixed(2) + ' / trigger: ' + TRIGGER_THRESHOLDS[TRIGGER_MODE].trigger;
        if (motionRatio > TRIGGER_THRESHOLDS[TRIGGER_MODE].unlock && !cameraUnlocked) {
            cameraUnlocked = true;
            if (!cooldownActive) videoContainerDOM.style.borderColor = "#007aff";
            initializeHardwareAudio(); 
        }
        if (motionRatio > TRIGGER_THRESHOLDS[TRIGGER_MODE].trigger && cameraUnlocked && !cooldownActive) {
            if (!motionTriggered && trackingReady) {
                motionTriggered = true; 
                if (isSleeping) { exitSleepState(); } else { executeSelectionAction(); }
            }
        } else if (motionRatio < TRIGGER_THRESHOLDS[TRIGGER_MODE].reset) { motionTriggered = false; }
        for (let i = 0; i < data.length; i++) { prevFrameData[i] = data[i]; }
    } catch (e) {}
    requestAnimationFrame(analyzePixelsLoop);
}

buildTier1UI();
startMasterScanLoop();
setupWebcam();
</script>
</body>
</html>
